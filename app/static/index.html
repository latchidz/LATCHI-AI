<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Latchi AI</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%233b82f6'/><text y='72' x='50' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>L</text></svg>">
</head>
<body>
<div class="app">

  <!-- ═══ السايدبار ═══ -->
  <aside class="side" id="side">
    <div class="side-top">
      <div class="brand">
        <div class="logo">L</div>
        <div>
          <div class="brand-t">Latchi AI</div>
          <div class="brand-s">SMART ENGINE</div>
        </div>
      </div>
      <button class="btn-new" id="newChat">＋ محادثة جديدة</button>
    </div>
    <div class="chats" id="chats"></div>
    <div class="side-foot">
      <div class="stat-row">
        <span class="dot" id="dot"></span>
        <span id="statTxt">كنحمّل المحرّك…</span>
      </div>
    </div>
  </aside>

  <!-- ═══ الرئيسي ═══ -->
  <main class="main">
    <div class="top">
      <button class="icon-btn" id="toggleSide" title="القائمة">☰</button>
      <div class="title" id="chatTitle">Latchi AI</div>
      <div class="model-chip" id="chip" style="display:none">
        <span class="bolt">⚡</span>
        <span class="mn" id="chipModel">—</span>
      </div>
    </div>

    <div class="msgs" id="msgs">
      <div class="wrap">
        <div class="empty" id="empty">
          <div class="big">L</div>
          <h2>واش نعاونك فيه؟</h2>
          <p>المحرّك الذكي كيختار الموديل الأنسب لكل سؤال، وإذا موديل تعطّل كيبدّل بوحدو ويكمّل نفس المحادثة — بلا ما تحسّ بوالو.</p>
          <div class="sugg">
            <button class="sg" data-q="اشرحلي كيفاش نتعلم البرمجة من الصفر بالدارجة"><b>🎓 تعلّم</b>البرمجة من الصفر</button>
            <button class="sg" data-q="ارسم صورة سيارة كلاسيكية فـساحة جزائرية وقت الغروب"><b>🎨 رسم</b>صورة بالوصف</button>
            <button class="sg" data-q="اكتبلي كود بايثون يقرا ملف Excel ويحسب المجموع"><b>💻 كود</b>بايثون لملف Excel</button>
            <button class="sg" data-q="لخصلي هاد النص بثلاث نقاط"><b>📝 تلخيص</b>نص طويل</button>
          </div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="cwrap">
        <div class="attached" id="attached"></div>
        <div class="box">
          <button class="sq attach" id="attachBtn" title="رفع صورة">📎</button>
          <input type="file" id="file" accept="image/*" hidden multiple>
          <textarea id="inp" rows="1" placeholder="اكتب رسالتك…" autocomplete="off"></textarea>
          <button class="sq send" id="send" disabled title="إرسال">↑</button>
        </div>
        <div class="hint">Latchi AI · تبديل تلقائي بين الموديلات · يكمل نفس المحادثة</div>
      </div>
    </div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
